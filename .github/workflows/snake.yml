name: Generate contribution snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ec4899&color_dots=#fdf2f8,#fbcfe8,#e879f9,#c026d3,#86198f
            dist/snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#1f1533,#4a1d6e,#9333ea,#d946ef,#f472b6
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
